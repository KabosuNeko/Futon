name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Ship binaries built with the newest Go (security fixes); go.mod
          # keeps 1.26 as the minimum, which CI also tests.
          go-version: 'stable'
          cache: true

      # Never publish a release whose tests fail.
      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # The config uses GoReleaser's v2 format; a new major must not break a release.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
